name: Decision-Gated Staging Admission

on:
  push:
    # One-time installation: the owner must pin this exact audited commit in
    # DECISION_GATE_BOOTSTRAP_SHA before pushing. Remove the pin after admission.
    branches: [feat/lokimetasmith-sync]
    paths: [.github/workflows/decision-merge.yml, scripts/decision-merge.py]
  workflow_run:
    workflows: [opencode, Agent PR Review Dispatch]
    types: [completed]
  schedule:
    # Retry fresh reviews that were held while tests were still running.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      review_run_id:
        description: Successful review workflow run ID (empty scans opted-in PRs)
        type: string
      pr_number:
        description: Optional expected PR number
        type: string
      dry_run:
        description: Evaluate only; do not approve or push staging
        type: boolean
        default: true

permissions:
  actions: read
  checks: read
  statuses: read
  contents: write
  pull-requests: write
  issues: read

jobs:
  installation-review:
    if: >-
      github.repository == 'niklas-olsson/keystone-polyphony' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'push' ||
       (github.actor == 'niklas-olsson' && vars.DECISION_GATE_BOOTSTRAP_SHA != '' &&
        github.sha == vars.DECISION_GATE_BOOTSTRAP_SHA))
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run_id: ${{ steps.installation_review.outputs.run_id }}
    steps:
      - name: Verify owner-pinned installation candidate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOOTSTRAP_SHA: ${{ vars.DECISION_GATE_BOOTSTRAP_SHA }}
          EVENT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$BOOTSTRAP_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BOOTSTRAP_SHA" = "$EVENT_SHA"
          gh api "repos/$REPO/pulls/86" > bootstrap-pr.json
          jq -e --arg sha "$BOOTSTRAP_SHA" --arg repo "$REPO" '
            .state == "open" and .draft == false and
            .head.sha == $sha and .head.repo.full_name == $repo and
            .head.ref == "feat/lokimetasmith-sync" and .base.ref == "main" and
            .base.sha == "8f23c9c7b721ad47ffbf5358a812dac2dba66999" and
            any(.labels[]; .name == "decision-merge")
          ' bootstrap-pr.json > /dev/null
      - name: Wait for independent installation review
        id: installation_review
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BOOTSTRAP_SHA: ${{ vars.DECISION_GATE_BOOTSTRAP_SHA }}
        run: |
          set -euo pipefail
          # This new workflow_run subscriber is not active on main yet. Wait
          # for the ordinary reviewer; never manufacture its evidence.
          for attempt in $(seq 1 80); do
            RUN=$(gh api "repos/$REPO/actions/workflows/opencode.yml/runs?head_sha=$BOOTSTRAP_SHA&event=pull_request&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha == "'"$BOOTSTRAP_SHA"'")] | sort_by(.id) | last // {}')
            VALIDATION=$(gh api "repos/$REPO/actions/workflows/pr-validation.yml/runs?head_sha=$BOOTSTRAP_SHA&event=pull_request&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha == "'"$BOOTSTRAP_SHA"'")] | sort_by(.id) | last // {}')
            for RESULT in "$RUN" "$VALIDATION"; do
              if [ "$(jq -r '.status // ""' <<< "$RESULT")" = completed ]; then
                test "$(jq -r '.conclusion' <<< "$RESULT")" = success
              fi
            done
            if [ "$(jq -r '.status // ""' <<< "$RUN")" = completed ] &&
               [ "$(jq -r '.status // ""' <<< "$VALIDATION")" = completed ]; then
              echo "run_id=$(jq -r '.id' <<< "$RUN")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo 'Installation review did not complete successfully in time.' >&2
          exit 1
      - name: Normal admission needs no installation wait
        if: github.event_name != 'push'
        run: 'true'
  decision-gate:
    needs: installation-review
    if: ${{ always() && needs.installation-review.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      # Wait outside this lock so existing staging writers can finish first.
      group: auto-merge-staging
      cancel-in-progress: false
    steps:
      - name: Checkout trusted default branch or owner-pinned installation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && vars.DECISION_GATE_BOOTSTRAP_SHA || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decision client dependency
        run: python -m pip install aiohttp
      - name: Evaluate reviewed commit and admit to staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_PUSH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DECISION_MERGE_MODEL: ${{ vars.DECISION_MERGE_MODEL || 'auto' }}
          DECISION_MERGE_REQUIRED_CHECKS: ${{ vars.DECISION_MERGE_REQUIRED_CHECKS || 'pr-validation' }}
          REVIEW_RUN_ID: ${{ needs.installation-review.outputs.run_id || github.event.workflow_run.id || inputs.review_run_id }}
          EXPECTED_PR: ${{ github.event_name == 'push' && '86' || inputs.pr_number }}
          DECISION_GATE_BOOTSTRAP_SHA: ${{ github.event_name == 'push' && vars.DECISION_GATE_BOOTSTRAP_SHA || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$REVIEW_RUN_ID" ]; then
            ARGS+=(--run-id "$REVIEW_RUN_ID")
          else
            ARGS+=(--scan)
          fi
          if [ -n "$EXPECTED_PR" ]; then
            ARGS+=(--pr-number "$EXPECTED_PR")
          fi
          if [ "$DRY_RUN" != 'true' ]; then
            ARGS+=(--apply)
          fi
          python scripts/decision-merge.py "${ARGS[@]}"
      - name: Preserve decision summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: decision-result.json
          if-no-files-found: warn
          retention-days: 7
