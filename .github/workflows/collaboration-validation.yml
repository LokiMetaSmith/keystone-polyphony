name: Collaboration Validation

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix src/liminal_bridge/sidecar
      - name: Enforce formatting and lint
        run: bash scripts/lint.sh
      - name: Run complete suite, including adversarial cases
        if: always()
        env:
          PYTHONPATH: src:.
          POLYPHONY_REAL_CHAT_TESTS: '1'
        run: python -m pytest -q
      - name: Measure incremental conversation frames and durable storage
        run: |
          python scripts/measure-conversation.py \
            --work-dir "$RUNNER_TEMP/conversation-measurement-state" \
            > conversation-measurements.json
      - name: Retain the credential-free conversation measurements
        uses: actions/upload-artifact@v4
        with:
          name: conversation-measurements
          path: conversation-measurements.json
          if-no-files-found: error
          retention-days: 14
