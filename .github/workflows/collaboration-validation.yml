name: Collaboration Validation

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix src/liminal_bridge/sidecar
      - name: Enforce formatting and lint
        run: |
          python -m black --diff src/liminal_bridge/mesh.py src/liminal_bridge/server.py tests/test_multimodal_transport.py tests/test_command_delivery.py tests/test_server_entrypoint.py scripts/check_root_install_hooks.py tests/test_install_hook_guard.py
          bash scripts/lint.sh
      - name: Run complete suite, including adversarial cases
        if: always()
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q
