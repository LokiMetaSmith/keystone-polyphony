name: Live Decision Model Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: Decisions API model ID
        type: string
        default: parallel/decisions-fast:free
  # Bootstrap on the integration branch before workflow_dispatch is available
  # through the default branch. No pull-request or scheduled secret access.
  push:
    branches: [feat/lokimetasmith-sync]
    paths:
      - .github/workflows/decision-model-smoke.yml
      - scripts/demo-decision-ensemble.py

permissions:
  contents: read

jobs:
  live-decision:
    if: github.repository == 'niklas-olsson/keystone-polyphony'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install demo dependencies
        run: python -m pip install aiohttp cryptography
      - name: Run ensemble demo with one live decision
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LIMINAL_DECISION_MODEL: ${{ inputs.model || 'parallel/decisions-fast:free' }}
          LIMINAL_DECISION_TIMEOUT: '20'
        run: python scripts/demo-decision-ensemble.py --live
