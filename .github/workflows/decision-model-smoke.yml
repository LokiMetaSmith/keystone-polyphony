name: Live Decision Model Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: Decisions API model ID (auto ranks free compatible models)
        type: string
        default: auto
  # Bootstrap on the integration branch before workflow_dispatch is available
  # through the default branch. No pull-request or scheduled secret access.
  push:
    branches: [feat/lokimetasmith-sync]
    paths:
      - .github/workflows/decision-model-smoke.yml
      - scripts/demo-decision-ensemble.py
      - scripts/probe-review-areas.py

permissions:
  contents: read

jobs:
  live-decision:
    if: github.repository == 'niklas-olsson/keystone-polyphony'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install demo dependencies
        run: python -m pip install aiohttp cryptography
      - name: Show ranked free model candidates
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from liminal_bridge.model_picker import get_model_candidates
          for kind in ("review", "decision"):
              print(json.dumps({"kind": kind, "candidates": get_model_candidates(kind)}))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned review CLI
        run: npm install -g opencode-ai@1.2.10
      - name: Smoke automatic free review selection
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cat > picker-smoke-prompt.txt <<'PROMPT'
          Review this complete Python function for integer addition only:
          def add(a: int, b: int) -> int:
              return a + b
          Do not use tools or edit files. Give a brief correctness review.
          End with exactly one final unfenced REVIEW_RESULT line containing JSON
          with verdict PASS or FAIL and blocking_findings as a nonnegative integer:
          REVIEW_RESULT: {"verdict":"PASS","blocking_findings":0}
          Use PASS only when there are zero blocking correctness findings.
          PROMPT
          python scripts/run-review-models.py --stdin-file picker-smoke-prompt.txt \
            --model-output picker-smoke-model.txt --json-events --timeout 60 -- \
            opencode run --model auto 'Review the supplied input.' > picker-smoke-review.txt
          cat picker-smoke-model.txt picker-smoke-review.txt
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from liminal_bridge.review_result import review_passed
          assert review_passed(Path("picker-smoke-review.txt").read_text()), "Smoke review did not independently PASS"
          PY
      - name: Probe area decisions on independent review examples
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/probe-review-areas.py
      - name: Run ensemble demo with live decision selection
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LIMINAL_DECISION_MODEL: ${{ inputs.model || 'auto' }}
          LIMINAL_DECISION_TIMEOUT: '20'
        run: python scripts/demo-decision-ensemble.py --live
