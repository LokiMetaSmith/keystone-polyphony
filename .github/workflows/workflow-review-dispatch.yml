name: Agent PR Review Dispatch

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number to review (for manual dispatch)"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch-review:
    if: >-
      github.repository == 'niklas-olsson/keystone-polyphony' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.pull_request.labels.*.name, 'workflow-review'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || secrets.GITHUB_TOKEN }}
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      AGENT_CLI: ${{ vars.REVIEW_AGENT_CLI || vars.AGENT_CLI || 'opencode' }}
      AGENT_OPENCODE_NPM_PACKAGE: ${{ vars.AGENT_OPENCODE_NPM_PACKAGE || 'opencode-ai@1.2.10' }}
      AGENT_OPENCLAW_NPM_PACKAGE: ${{ vars.AGENT_OPENCLAW_NPM_PACKAGE || 'openclaw@2026.2.23' }}
      AGENT_CLAUDE_NPM_PACKAGE: ${{ vars.AGENT_CLAUDE_NPM_PACKAGE || '@anthropic-ai/claude-code@2.1.52' }}
      AGENT_CLI_FLAGS: ${{ vars.AGENT_CLI_FLAGS }}
      AGENT_PROMPT_MODE: ${{ vars.REVIEW_AGENT_PROMPT_MODE || '' }}
      AGENT_PROMPT_FLAG: ${{ vars.REVIEW_AGENT_PROMPT_FLAG || '--prompt' }}
      AGENT_MODEL: ${{ vars.REVIEW_AGENT_MODEL || vars.AGENT_MODEL || 'auto' }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Identify PR
        id: identify
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_PR_NUMBER" ]; then
              PR_NUMBER="$INPUT_PR_NUMBER"
            else
              # Find first PR with workflow-review label
              PR_NUMBER=$(gh pr list --label "workflow-review" --limit 1 --json number --jq '.[0].number')
            fi
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "No eligible PR found."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid PR number."
            exit 1
          fi

          # Check if already reviewed (optional optimization, but we can re-review)
          echo "Selected PR #$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate Agent Credentials
        id: creds
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$AGENT_MODEL" == openrouter/* || "$AGENT_MODEL" == auto ]]; then
            AGENT_API_KEY="${OPENROUTER_API_KEY:-${AGENT_API_KEY:-}}"
          fi
          if [ -z "${AGENT_API_KEY:-}" ]; then
            echo "::notice::No API key configured for the selected model. Set OPENROUTER_API_KEY for OpenRouter or AGENT_API_KEY for other providers. Skipping automated agent review dispatch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.creds.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Agent CLI
        if: steps.creds.outputs.skip != 'true'
        run: |
          set -euo pipefail

          case "$AGENT_CLI" in
            opencode)
              npm install -g "$AGENT_OPENCODE_NPM_PACKAGE"
              ;;
            openclaw)
              npm install -g "$AGENT_OPENCLAW_NPM_PACKAGE"
              ;;
            claude)
              npm install -g "$AGENT_CLAUDE_NPM_PACKAGE"
              ;;
            *)
              echo "No default install configured for AGENT_CLI='$AGENT_CLI'."
              echo "Use opencode/openclaw/claude, or extend this workflow for custom CLIs."
              exit 1
              ;;
          esac

      - name: Select Reviewer & Check Quota
        if: steps.identify.outputs.pr_number != '' && steps.creds.outputs.skip != 'true'
        id: quota
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.identify.outputs.pr_number }}"

          # 1. Load reviewers config
          # We use yq to parse .github/reviewers.yml
          REVIEWERS_JSON=$(yq -o json . .github/reviewers.yml | jq -c '.reviewers')
          COUNT=$(echo "$REVIEWERS_JSON" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "No reviewers configured."
            exit 1
          fi

          # 2. Select Reviewer (Simple Round Robin based on PR Number)
          INDEX=$((PR_NUMBER % COUNT))
          REVIEWER=$(echo "$REVIEWERS_JSON" | jq -c ".[$INDEX]")

          NAME=$(echo "$REVIEWER" | jq -r '.name')
          HANDLE=$(echo "$REVIEWER" | jq -r '.handle')
          LABEL=$(echo "$REVIEWER" | jq -r '.label')
          QUOTA_VAR=$(echo "$REVIEWER" | jq -r '.quota_var')

          echo "Selected Reviewer: $NAME ($LABEL)"
          echo "reviewer_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "reviewer_handle=$HANDLE" >> "$GITHUB_OUTPUT"
          echo "reviewer_label=$LABEL" >> "$GITHUB_OUTPUT"

          # 3. Check Quota
          LIMIT=0
          # Fetch variable value, or "0" if missing/error, then strip whitespace
          LIMIT_RAW=$(gh api "/repos/$REPO/actions/variables/$QUOTA_VAR" --jq '.value // "0"' 2>/dev/null | tr -d '[:space:]' || echo "0")

          if [[ "$LIMIT_RAW" =~ ^[0-9]+$ ]]; then
            LIMIT="$LIMIT_RAW"
          fi

          if [ "$LIMIT" -eq 0 ]; then
             # Missing or non-numeric quota vars should not block assignment.
             LIMIT=999999
          fi

          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)

          # Count items (issues/PRs) assigned to this reviewer label in last 24h
          ASSIGNED_TODAY=0
          RECENT_ITEMS=$(gh api "/repos/$REPO/issues?labels=$LABEL&state=all&since=$SINCE&per_page=100" --jq '.[].number')

          for ITEM in $RECENT_ITEMS; do
            LABELED_AT=$(gh api "/repos/$REPO/issues/$ITEM/timeline" \
                --jq "[.[] | select(.event == \"labeled\" and .label.name == \"$LABEL\")] | last | .created_at // empty" 2>/dev/null || echo "")
            if [ -n "$LABELED_AT" ] && [[ "$LABELED_AT" > "$SINCE" ]]; then
               ASSIGNED_TODAY=$((ASSIGNED_TODAY + 1))
            fi
          done

          echo "Quota usage for $NAME: $ASSIGNED_TODAY / $LIMIT"

          if [ "$ASSIGNED_TODAY" -ge "$LIMIT" ]; then
            echo "Quota reached."
            # Tag PR with quota-hold if not present
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "quota-hold"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
             # Remove quota-hold if present
             gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "quota-hold" --add-label "$LABEL"
             echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose Prompt
        if: steps.identify.outputs.pr_number != '' && steps.creds.outputs.skip != 'true' && steps.quota.outputs.skip == 'false'
        id: prompt
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.identify.outputs.pr_number }}"
          REVIEWER_NAME="${{ steps.quota.outputs.reviewer_name }}"
          REVIEWER_HANDLE="${{ steps.quota.outputs.reviewer_handle }}"

          gh api "/repos/$REPO/pulls/$PR_NUMBER" > review_pr.json
          TITLE=$(jq -r .title review_pr.json)
          BODY=$(jq -r .body review_pr.json)
          BASE_SHA=$(jq -r '.base.sha' review_pr.json)
          HEAD_SHA=$(jq -r '.head.sha' review_pr.json)
          gh api "/repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" -H 'Accept: application/vnd.github.diff' > pr_patch.diff
          DECISION_MERGE=$(jq '[.labels[].name] | index("decision-merge") != null' review_pr.json)
          echo "decision_merge=$DECISION_MERGE" >> "$GITHUB_OUTPUT"

          {
            echo "You are acting as **$REVIEWER_NAME** ($REVIEWER_HANDLE)."
            echo "Your task is to review Pull Request #$PR_NUMBER which modifies GitHub Actions workflow files."
            echo ""
            echo "## PR Context"
            echo "Title: $TITLE"
            echo "Description:"
            echo "$BODY"
            echo ""
            echo "## PR Diff (review workflow changes in context)"
            echo "\`\`\`diff"
            cat pr_patch.diff
            echo "\`\`\`"
            echo ""
            if [ -f AGENTS.md ]; then
              echo "## Repository Conventions (AGENTS.md)"
              cat AGENTS.md
              echo ""
            fi
            echo "## Review Criteria"
            echo "1. **Security**: Check for secret exfiltration, unauthorized external requests, privilege escalation, or malicious code patterns."
            echo "2. **Value**: Confirm the workflow changes serve a legitimate project purpose."
            echo "3. **Legitimacy**: Ensure the code is not malicious."
            echo ""
            echo "## Instructions"
            echo "- Analyze the diff carefully."
            echo '- Return GitHub-flavored Markdown with ## Summary, ## Findings, and ## Recommendation sections.'
            echo '- End with an explicit go/no-go recommendation and explain any blockers.'
            if [ "$DECISION_MERGE" = true ]; then
              echo '- Review the ENTIRE diff for correctness, security, architecture, tests, and compatibility. Prior workflow-specific scope instructions do not limit this review. Give a GO/no-go recommendation covering all changed files.'
              echo '- Include separate Correctness, Security, Test coverage, Architecture, and Compatibility sections. Explain the evidence and unresolved findings in each; distinguish resolved issues from current blockers.'
              echo '- End with exactly one REVIEW_RESULT marker as the final nonempty, unfenced line: REVIEW_RESULT: {"verdict":"PASS","blocking_findings":0}'
              echo '- Use PASS only if the review actually passes with zero blocking findings. Otherwise use FAIL and a nonnegative integer blocking count, for example: REVIEW_RESULT: {"verdict":"FAIL","blocking_findings":1}'
              echo '- Never return PASS merely to satisfy the requested format.'
              echo '- Analysis only: do not approve, merge, comment, edit, or otherwise mutate the PR. The separate decision gate handles admission to staging.'
            else
              echo "- If safe, submit approval with gh pr review $PR_NUMBER --approve."
              echo "- If there are concerns, submit a detailed review with gh pr review $PR_NUMBER --request-changes."
            fi
          } > agent_prompt.txt

          echo "Prompt prepared."

      - name: Run Agent
        id: run_agent
        if: steps.identify.outputs.pr_number != '' && steps.creds.outputs.skip != 'true' && steps.quota.outputs.skip == 'false'
        timeout-minutes: 15
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$AGENT_MODEL" == openrouter/* || "$AGENT_MODEL" == auto ]]; then
            AGENT_API_KEY="${OPENROUTER_API_KEY:-${AGENT_API_KEY:-}}"
          fi

          AUTO_PICKER=false
          if [ "$AGENT_MODEL" = auto ]; then
            if [ -f scripts/run-review-models.py ]; then
              AUTO_PICKER=true
            else
              AGENT_MODEL=openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
              echo "::notice::Dynamic picker activates after trusted-base merge; using bootstrap free model."
            fi
          fi

          CMD=("$AGENT_CLI")
          if [ -n "$AGENT_CLI_FLAGS" ]; then
            read -ra FLAGS <<< "$AGENT_CLI_FLAGS"
            CMD+=("${FLAGS[@]}")
          fi

          if [[ "$AGENT_CLI" == "opencode" ]]; then
            CMD+=("run")
          elif [[ "$AGENT_CLI" == "openclaw" ]]; then
            CMD+=("--yolo")
          elif [[ "$AGENT_CLI" == "claude" ]]; then
            CMD+=("--non-interactive")
          fi

          if [ -n "$AGENT_MODEL" ]; then
            CMD+=("--model" "$AGENT_MODEL")
          fi

          PROMPT_MODE="${AGENT_PROMPT_MODE:-}"
          if [ -z "$PROMPT_MODE" ]; then
            if [[ "$AGENT_CLI" == "opencode" ]]; then
              PROMPT_MODE=stdin
            else
              PROMPT_MODE=flag
            fi
          fi
          case "$PROMPT_MODE" in
            stdin)
              if [[ "$AGENT_CLI" == "opencode" ]]; then
                CMD+=("Review the supplied input and follow its instructions.")
              fi
              ;;
            positional)
              CMD+=("$(cat agent_prompt.txt)")
              ;;
            flag)
              CMD+=("${AGENT_PROMPT_FLAG:---prompt}" "$(cat agent_prompt.txt)")
              ;;
            *)
              echo "Unsupported REVIEW_AGENT_PROMPT_MODE: $PROMPT_MODE" >&2
              exit 1
              ;;
          esac

          echo "Running agent: ${CMD[0]} ... (redacted prompt)"

          PROMPT_INPUT=/dev/null
          if [ "$PROMPT_MODE" = stdin ]; then
            PROMPT_INPUT=agent_prompt.txt
          fi
          if [ "$AUTO_PICKER" = true ]; then
            PICKER_ARGS=(--model-output review_model.txt)
            if [ "$PROMPT_MODE" = stdin ]; then
              PICKER_ARGS+=(--stdin-file agent_prompt.txt)
            fi
            if [ "$AGENT_CLI" = opencode ]; then
              PICKER_ARGS+=(--json-events)
            fi
            CMD=(python3 scripts/run-review-models.py "${PICKER_ARGS[@]}" -- "${CMD[@]}")
          fi
          set +e
          env \
            AGENT_API_KEY="$AGENT_API_KEY" \
            OPENAI_API_KEY="$AGENT_API_KEY" \
            OPENROUTER_API_KEY="$AGENT_API_KEY" \
            ANTHROPIC_API_KEY="$AGENT_API_KEY" \
            GROK_API_KEY="$AGENT_API_KEY" \
            GEMINI_API_KEY="$AGENT_API_KEY" \
            DEEPSEEK_API_KEY="$AGENT_API_KEY" \
            OPENAI_API_BASE="https://openrouter.ai/api/v1" \
            "${CMD[@]}" < "$PROMPT_INPUT" 2>&1 | tee review_output_raw.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$AUTO_PICKER" = true ] && [ -s review_model.txt ]; then
            AGENT_MODEL=$(cat review_model.txt)
          fi
          echo "model=$AGENT_MODEL" >> "$GITHUB_OUTPUT"
          perl -pe 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g; s/\r//g' review_output_raw.txt > review_output.txt
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Agent failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Validate immutable review evidence
        if: steps.run_agent.outputs.exit_code == '0' && steps.prompt.outputs.decision_merge == 'true'
        env:
          REVIEW_MODEL: ${{ steps.run_agent.outputs.model }}
        run: |
          SCOPE=workflow
          if jq -e '[.labels[].name] | index("decision-merge") != null' review_pr.json >/dev/null; then
            SCOPE=general
          fi
          python3 scripts/write-review-evidence.py --snapshot review_pr.json --review review_output.txt \
            --output review-evidence.json --scope "$SCOPE" --model "$REVIEW_MODEL" \
            --workflow-path .github/workflows/workflow-review-dispatch.yml --exit-code 0

      - name: Publish immutable review evidence
        if: success() && steps.run_agent.outputs.exit_code == '0' && steps.prompt.outputs.decision_merge == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decision-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-evidence.json
          if-no-files-found: error
          retention-days: 7
