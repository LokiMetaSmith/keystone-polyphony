name: CLI Agent Issue Solver

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Retry a specific open issue; empty selects the oldest ready issue"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  solve-issue:
    # Only run on upstream and only when the issue has the 'ready for work' label.
    if: >-
      github.repository == 'niklas-olsson/keystone-polyphony' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.label.name == 'ready for work' || contains(github.event.issue.labels.*.name, 'ready for work')))
    runs-on: ubuntu-latest
    concurrency:
      group: issue-solver-${{ github.event.issue.number || inputs.issue_number || 'queue' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGENT_CLI: ${{ vars.AGENT_CLI || 'opencode' }}
      AGENT_OPENCODE_NPM_PACKAGE: ${{ vars.AGENT_OPENCODE_NPM_PACKAGE || 'opencode-ai@1.2.10' }}
      AGENT_CLI_FLAGS: ${{ vars.AGENT_CLI_FLAGS }}
      AGENT_DAILY_TASKS: ${{ vars.AGENT_DAILY_TASKS || 5 }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Agent CLI
        if: env.AGENT_CLI == 'opencode'
        run: |
          npm install -g "$AGENT_OPENCODE_NPM_PACKAGE"

      - name: Ensure labels exist
        run: |
          set -euo pipefail
          ensure_label() {
            local NAME="$1" COLOR="$2" DESC="$3"
            # Idempotent creation: check if exists, if not create
            if ! gh label list --repo "$REPO" --limit 1000 --json name --jq '.[].name' | grep -q "^$NAME$"; then
              gh api --method POST "/repos/$REPO/labels" \
                --repo "$REPO" \
                -f name="$NAME" \
                -f color="$COLOR" \
                -f description="$DESC"
            fi
          }
          ensure_label "agent-working" "1D76DB" "Agent is currently working on this issue"
          ensure_label "agent-failed"  "E11D48" "Agent attempted but failed to solve the issue"
          ensure_label "agent-pr"      "7C3AED" "PR was created by an agent"
          ensure_label "quota-hold"    "D93F0B" "Waiting for daily quota to reset"

      - name: Identify issue
        id: identify
        env:
          TARGET_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$TARGET_ISSUE" ]; then
              [[ "$TARGET_ISSUE" =~ ^[0-9]+$ ]] || { echo "Invalid issue number" >&2; exit 1; }
              ISSUE_DATA=$(gh api "/repos/$REPO/issues/$TARGET_ISSUE")
              if echo "$ISSUE_DATA" | jq -e '.state == "open" and (.pull_request == null) and ([.labels[].name] | index("agent-working") | not)' >/dev/null; then
                echo "issue_number=$TARGET_ISSUE" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Target issue is closed, a PR, or already being worked on." >&2
              exit 1
            fi
            # Find oldest 'ready for work' issue that isn't being worked on
            ISSUE_NUMBER=$(gh api "/repos/$REPO/issues?labels=ready+for+work&state=open&sort=created&direction=asc&per_page=100" \
              --jq '.[] | select(.labels | map(.name) | index("agent-working") | not) | .number' | head -n 1)
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
            # Verify it has 'ready for work' and not 'agent-working'
            LABELS=$(gh api "/repos/$REPO/issues/$ISSUE_NUMBER" --jq '.labels[].name')
            if ! echo "$LABELS" | grep -q "ready for work"; then
              echo "Issue #$ISSUE_NUMBER does not have 'ready for work' label. Skipping."
              ISSUE_NUMBER=""
            elif echo "$LABELS" | grep -q "agent-working"; then
              echo "Issue #$ISSUE_NUMBER is already being worked on. Skipping."
              ISSUE_NUMBER=""
            fi
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No eligible issue found."
            echo "issue_number=" >> "$GITHUB_OUTPUT"
          else
            echo "Selected issue #$ISSUE_NUMBER"
            echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Quota
        if: steps.identify.outputs.issue_number != ''
        id: quota
        run: |
          set -euo pipefail
          LIMIT="${AGENT_DAILY_TASKS:-5}"
          if [ "$LIMIT" -eq 0 ]; then LIMIT=999999; fi

          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)

          echo "Checking quota since $SINCE (Limit: $LIMIT)"

          ASSIGNED_TODAY=0
          # Audit timelines of issues updated in the last 24h to count 'agent-working' assignments
          RECENT_ISSUES=$(gh api "/repos/$REPO/issues?state=all&since=$SINCE&per_page=100" --jq '.[].number')
          for JNUM in $RECENT_ISSUES; do
            LABELED_AT=$(gh api "/repos/$REPO/issues/$JNUM/timeline" \
              --jq '[.[] | select(.event == "labeled" and .label.name == "agent-working")] | .[].created_at' 2>/dev/null | grep -E "^[0-9]{4}" | sort | tail -n 1 || echo "")

            if [ -n "$LABELED_AT" ] && [[ "$LABELED_AT" > "$SINCE" ]]; then
              echo "Issue #$JNUM was assigned to agent at $LABELED_AT"
              ASSIGNED_TODAY=$((ASSIGNED_TODAY + 1))
            fi
          done

          echo "Issues assigned to agents in last 24h: $ASSIGNED_TODAY / $LIMIT"
          if [ "$ASSIGNED_TODAY" -ge "$LIMIT" ]; then
            echo "Quota reached. Holding issue #${{ steps.identify.outputs.issue_number }}."
            gh issue edit "${{ steps.identify.outputs.issue_number }}" --repo "$REPO" --add-label "quota-hold"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage Agent Runner
        run: cp scripts/run-issue-agent.py "$RUNNER_TEMP/run-issue-agent.py"

      - name: Prepare Workspace
        if: steps.identify.outputs.issue_number != '' && steps.quota.outputs.skip == 'false'
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.identify.outputs.issue_number }}"
          BRANCH_NAME="feat/agent-$ISSUE_NUMBER-$GITHUB_RUN_ID"

          # Label swap
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "ready for work" --remove-label "quota-hold" --remove-label "agent-failed" --add-label "agent-working"

          # Branch creation
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          echo "AGENT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compose Prompt
        if: steps.identify.outputs.issue_number != '' && steps.quota.outputs.skip == 'false'
        id: prompt
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.identify.outputs.issue_number }}"
          ISSUE_DATA=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body)
          TITLE=$(echo "$ISSUE_DATA" | jq -r .title)
          BODY=$(echo "$ISSUE_DATA" | jq -r .body)

          {
            echo "Issue #$ISSUE_NUMBER: $TITLE"
            echo ""
            echo "$BODY"
            echo ""
            if [ -f AGENTS.md ]; then
              echo "Repository Conventions (AGENTS.md):"
              cat AGENTS.md
              echo ""
            fi

            # Find .feature files referenced in body
            FEATURE_FILES=$(echo "$BODY" | grep -oE "docs/features/[a-zA-Z0-9_-]+\.feature" | sort -u || true)
            for FILE in $FEATURE_FILES; do
              if [ -f "$FILE" ]; then
                echo ""
                echo "Reference Feature File ($FILE):"
                cat "$FILE"
              fi
            done
          } > "$RUNNER_TEMP/agent_prompt.txt"

          echo "prompt_file=$RUNNER_TEMP/agent_prompt.txt" >> "$GITHUB_OUTPUT"

      - name: Run Agent
        if: steps.identify.outputs.issue_number != '' && steps.quota.outputs.skip == 'false'
        timeout-minutes: 12
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          set -euo pipefail
          set +e
          python3 "$RUNNER_TEMP/run-issue-agent.py" --prompt "$RUNNER_TEMP/agent_prompt.txt"
          EXIT_CODE=$?
          set -e
          echo "agent_exit_code=$EXIT_CODE" >> "$GITHUB_ENV"

      - name: Commit and Push
        if: steps.identify.outputs.issue_number != '' && steps.quota.outputs.skip == 'false' && env.agent_exit_code == '0'
        id: commit
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.identify.outputs.issue_number }}"
          BRANCH_NAME="feat/agent-$ISSUE_NUMBER-$GITHUB_RUN_ID"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "feat/agent-$ISSUE_NUMBER: solve issue"
          fi
          # Some custom agents commit their edits themselves. Detect those
          # commits as well as worktree changes, without counting prompt files.
          if [ "$(git rev-parse HEAD)" != "$AGENT_BASE_SHA" ]; then
            git push origin "$BRANCH_NAME"
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.identify.outputs.issue_number != '' && steps.quota.outputs.skip == 'false' && steps.commit.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.identify.outputs.issue_number }}"
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title -q .title)
          BRANCH_NAME="feat/agent-$ISSUE_NUMBER-$GITHUB_RUN_ID"

          gh pr create \
            --repo "$REPO" \
            --title "feat/agent-$ISSUE_NUMBER: $ISSUE_TITLE" \
            --body "Closes #$ISSUE_NUMBER" \
            --head "$BRANCH_NAME" \
            --base main \
            --label "agent-pr"

          # A successful retry clears the stale failure label.
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "agent-working" --remove-label "agent-failed"

      - name: Handle Failure
        if: >-
          always() && steps.identify.outputs.issue_number != '' && steps.quota.outputs.skip == 'false' &&
          (failure() || env.agent_exit_code != '0' || steps.commit.outputs.changes == 'false')
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${{ steps.identify.outputs.issue_number }}"

          if [ -n "${{ env.agent_exit_code }}" ] && [ "${{ env.agent_exit_code }}" != "0" ]; then
            REASON="Agent exited with non-zero code (${{ env.agent_exit_code }})."
          elif [ "${{ steps.commit.outputs.changes }}" = "false" ]; then
            REASON="No changes were produced by the agent."
          else
            REASON="Agent execution or PR publication did not complete. Check the failing workflow step."
          fi

          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "agent-working" --add-label "agent-failed"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "## ❌ Agent Task Failed

          $REASON

          Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details."

      - name: Propagate Failure
        if: >-
          always() && steps.identify.outputs.issue_number != '' && steps.quota.outputs.skip == 'false' &&
          (failure() || env.agent_exit_code != '0' || steps.commit.outputs.changes == 'false')
        run: exit 1
