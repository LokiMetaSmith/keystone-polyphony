name: One-time Black formatting for staging

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/staging-black-format-once.yml

permissions:
  contents: write

jobs:
  format-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Black
        run: python -m pip install black==26.10.1

      - name: Format Python sources
        run: python -m black . --exclude="third_party|.venv"

      - name: Verify formatting
        run: python -m black . --exclude="third_party|.venv" --check --quiet

      - name: Commit formatting changes to staging
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- '*.py'
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: format staging Python files with Black"
            git push origin HEAD:staging
          fi
